# CLAFS on Apache (Docker / Railway). public/ is the web root (set in the Dockerfile), so config/, src/,
# templates/, database/, docker/ and docs/ are outside it and can't be requested by URL.

ServerName localhost
ServerTokens Prod
ServerSignature Off
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "DENY"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
# Railway serves only HTTPS; browsers ignore this header on plain-HTTP localhost.
Header always set Strict-Transport-Security "max-age=31536000"
# No inline scripts or style attributes: page config is a JSON data block and dynamic widths are set from app.js.
# connect-src allows the public-holiday API used by api.js; blob: is the photo preview before upload.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://date.nager.at; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

<Directory /var/www/html/public>
    Options -Indexes
    DirectoryIndex index.php
</Directory>

# User uploads are data, never code. Set here as well as in public/uploads/.htaccess,
# because a mounted volume hides that .htaccess and Apache ignores .htaccess by default.
<Directory /var/www/html/public/uploads>
    Options -ExecCGI
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|php\d|phar|pl|py|cgi|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
