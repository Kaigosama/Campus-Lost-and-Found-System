# CLAFS on Apache (Docker / Railway). The repo root is the web root.

ServerName localhost
ServerTokens Prod
ServerSignature Off
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"

<Directory /var/www/html>
    Options -Indexes
    DirectoryIndex index.php
</Directory>

# PHP that is only ever included, and deployment files, are not pages.
<DirectoryMatch "^/var/www/html/(config|includes|docker)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "\.(sql|sh|md|ini)$">
    Require all denied
</FilesMatch>

# User uploads are data, never code. Set here as well as in public/uploads/.htaccess,
# because a mounted volume hides that .htaccess and Apache ignores .htaccess by default.
<Directory /var/www/html/public/uploads>
    Options -ExecCGI
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|php\d|phar|pl|py|cgi|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
